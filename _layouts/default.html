<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9689026854281225"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title | escape }} - {% endif %}CyberDad</title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5B1LNCPB56"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5B1LNCPB56');
    </script>
    <!-- GA4 events (generate_lead, begin_checkout); uses the gtag above, no second tag -->
    <script src="{{ '/assets/js/cdk-events.js' | relative_url }}" defer></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://cyberdad2025.github.io/#organization",

      "logo": "https://cyberdad2025.github.io/assets/logo.png",
      "description": "Family online safety guidance from Ruel Miller, a U.S. Marine Corps veteran and CompTIA Security+ certified dad with hands-on Security Operations Center experience, who built CyberDadKit to help families protect themselves online.",
      "founder": {
        "@type": "Person",
        "@id": "https://cyberdad2025.github.io/about/#ruel-miller",
        "name": "Ruel Miller"
      },
      "sameAs": [
        "https://www.pinterest.com/cyberdadkit"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "ruel@getcyberdadkit.com",
        "contactType": "customer support"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://cyberdad2025.github.io/about/#ruel-miller",
      "name": "Ruel Miller",
      "jobTitle": "Founder, CyberDadKit",
      "worksFor": {
        "@id": "https://cyberdad2025.github.io/#organization"
      },
      "url": "https://cyberdad2025.github.io/about/",
      "email": "ruel@getcyberdadkit.com",
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",

            "@type": "Organization",

        }

        "Family cybersecurity",
        "Online safety for children",
        "Home network security",
        "Phishing prevention",
        "Parental controls"
      ],
      "alumniOf": { "@type": "GovernmentOrganization", "name": "United States Marine Corps", "url": "https://www.marines.mil" },
      "description": "Ruel Miller is a U.S. Marine Corps veteran and CompTIA Security+ certified dad with hands-on Security Operations Center experience, who built CyberDadKit to help families protect themselves online."
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://cyberdad2025.github.io/#website",
      "url": "https://cyberdad2025.github.io",
      "name": "CyberDad Kit",
      "publisher": {
        "@id": "https://cyberdad2025.github.io/#organization"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cyberdad2025.github.io/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- MailerLite Universal (account 1632878): powers the embedded signup form and the "Cyber Dad" popup -->
    <script>
      if (!window.ml) {
        (function(w,d,e,u,f,l,n){w[f]=w[f]||function(){(w[f].q=w[f].q||[]).push(arguments);},l=d.createElement(e),l.async=1,l.src=u,
        n=d.getElementsByTagName(e)[0],n.parentNode.insertBefore(l,n);})
        (window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
        // Phones and portrait tablets (<=960px, the site's single-column breakpoint): don't fetch/show MailerLite popups.
        // There the full-screen popup covered the page and the Shield Kit buttons; the in-page KxzppG form stays.
        // Must run before ml('account'); embedded forms are unaffected. Desktop keeps the popup.
        if (window.matchMedia && window.matchMedia('(max-width: 960px)').matches) { ml('enablePopups', false); }
        ml('account', '1632878');
      }
    </script>
    <!-- End MailerLite Universal -->
    <!-- Honeypot for the KxzppG signup form (client-side only; the trap field is never sent to MailerLite) -->
    <script src="{{ '/assets/js/cdk-honeypot.js' | relative_url }}" defer></script>
</head>
<body>
    <div class="site-wrapper">
        {{ content }}
    </div>
</body>
</html>
