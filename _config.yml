# Jekyll Configuration for CyberDadKit
# G2 (Growth): one value per key. Duplicate title/description/author/plugins keys removed (YAML keeps only the last one, which silently overrode the first block).
title: "CyberDadKit"
description: "Plain-English family online safety from CyberDadKit: home Wi-Fi, kids' devices, passwords and scams, with a free family tech safety checklist."
author:
  name: "Ruel Miller"
  email: "ruel@getcyberdadkit.com"
email: "ruel@getcyberdadkit.com"
url: "https://cyberdad2025.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title.html

# CRITICAL FIX - Allow future posts and set timezone
future: true
timezone: America/New_York

# GA4 (G-5B1LNCPB56) is loaded once by _layouts/default.html; no google_analytics key (it held a placeholder).

# Theme
remote_theme: jekyll/minima

# Social links
twitter_username: cyberdad2025
github_username: CyberDad2025

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title.html

# Default layout for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "CyberDad2025"
  - scope:
      path: ""
    values:
      layout: "default"

# Pagination
paginate: 25
paginate_path: "/page:num/"

# SEO
lang: en
google_site_verification: # Add your verification code here later

# Navigation
header_pages:
  - about.md
  - contact.md

# Exclude files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .github
  # Non-site files (repo tooling, generator code, bot logs): kept in the repo, not published (R5, CoS 2026-10-20)
  - main.py
  - smart_fm_update.py
  - requirements.txt
  - package.json
  - netlify
  - logs
  - scripts/analytics_fixed.py
  - scripts/content_generator.py
  - scripts/dedicated_blog_ai.py
  - scripts/multi_ai_blog_generator.py
  - scripts/pinterest_traffic_blitz.py
  - scripts/premium_content_generator.py
  - "Add ethical compliance system with GDPR controls"

# Include files
include:
  - _pages

# Sass
sass:
  style: compressed

# Security
safe: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
