{%- comment -%}
  mobile-perf (fix/mobile-perf): small style fixes for every post page, scoped with enough specificity that the
  inline <style> blocks many posts carry (global h2/p/strong/.post-meta rules) cannot override them. No copy changes.
  - .cdk-dateline: one-line date/author shown instead of the duplicate title header on template posts.
  - Related/Popular headings are h2 now (heading order); keep their old h3 look.
  - Links inside post text are underlined (WCAG link-in-text-block).
  - Template posts' "Email This"/"Print" buttons: #3498db (3.15:1 with white) -> #1f6fa8 (5.39:1).
  - Template posts' header pills (read time / difficulty / ages): white text on a darker pill instead of grey on a
    20% white pill; on phones (<=480px) the pills sit in one wrapped row and the box is less padded, so the
    intro and the top kit CTA start on the first screen.
{%- endcomment -%}
<style>
.post .cdk-dateline{margin:0 0 .75rem;font-size:.9rem;line-height:1.4;color:#4a5568}
.post .cdk-dateline time,.post .cdk-dateline span{color:inherit}
.post .related-posts h2.cdk-section-title,.post .popular-posts h2.cdk-section-title{font-size:1.17em;font-weight:700;line-height:1.3;margin:0 0 .5rem;padding:0;border:0;color:inherit}
.post .post-content p a,.post .post-content li a{text-decoration:underline}
.post .post-content a.share-email,.post .post-content a.share-print{background:#1f6fa8;color:#fff}
.post .post-content a.share-email:hover,.post .post-content a.share-print:hover{background:#185a8c;color:#fff}
.post .post-content .post-header .post-meta span{color:#fff;background:rgba(0,0,0,.22)}
@media (max-width:480px){
.post .post-content .post-header{padding:20px 16px}
.post .post-content .post-header h1{margin:0 0 12px;font-size:1.6em;line-height:1.2}
.post .post-content .post-header .post-meta{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:12px}
.post .post-content .post-header .post-meta span{padding:4px 10px;font-size:.8em}
.post .post-content .post-header .post-summary{margin-top:12px;padding:14px}
}
</style>
